<dialog #dialog class="modal" [class.modal--small]="size === 'small'" [class.modal--medium]="size === 'medium'"
  [class.modal--large]="size === 'large'" [class.modal--fullscreen]="size === 'fullscreen'" [class.modal--busy]="busy"
  [attr.role]="role" [attr.aria-modal]="'true'" [attr.aria-labelledby]="title ? modalId + '-title' : null"
  [attr.aria-label]="title ? null : ariaLabel" [attr.aria-describedby]="
    description ? modalId + '-description' : null
  " (cancel)="onCancel($event)" (click)="onBackdropClick($event)" (close)="onNativeClose()">
  <div class="modal__surface">
    <!-- ============================================================
         HEADER
         ============================================================ -->

    <header class="modal__header">
      <div class="modal__heading">
        @if (title) {
        <h2 class="modal__title" [id]="modalId + '-title'">
          {{ title }}
        </h2>
        }

        @if (description) {
        <p class="modal__description" [id]="modalId + '-description'">
          {{ description }}
        </p>
        }

        <!-- Optional custom header content -->
        <ng-content select="[modalHeader]" />
      </div>

      @if (showCloseButton && dismissible) {
      <button type="button" class="modal__close" aria-label="Close dialog" [disabled]="busy" (click)="close()">
        <i class="fa-solid fa-xmark" aria-hidden="true"></i>
      </button>
      }
    </header>

    <!-- ============================================================
         BODY
         ============================================================ -->

    <div class="modal__body">
      <ng-content />
    </div>

    <!-- ============================================================
         FOOTER
         ============================================================ -->

    <footer class="modal__footer">
      <ng-content select="[modalFooter]" />
    </footer>
  </div>
</dialog>
